# the rules, presented when someone hasn't played the game yet or runs /game_rules
rules: "<b>الحرباء - اللعبة</b> <i>(قواعد بالإنجليزية، مخصصة لبوت التليجرام)</i>\n\n
• بعد بدء اللعبة، يصبح أحد اللاعبين هو الحرباء، والباقون لاعبون عاديون\n
• يُعرض موضوع مع قائمة كلمات تابعة له، مع زر مرتبط بها\n
• إذا كنت لاعباً وضغطت على هذا الزر، ستظهر لك إحدى كلمات القائمة (تسمى الكلمة السرية) - يحصل الجميع على نفس الكلمة بالطبع. أما إذا كنت الحرباء، سيتم إعلامك بهذه الحقيقة بدلاً من ذلك\n
• الآن يطلب البوت من اللاعبين واحداً تلو الآخر وصف الكلمة السرية.\n
• إذا كنت لاعباً، حاول وصف الكلمة السرية بطريقة تجعل الحرباء عاجزة عن تخمينها؛ ولكنها تجعل اللاعبين الآخرين متأكدين تماماً أنك لست الحرباء\n
• إذا كنت الحرباء، عليك اختيار وصف بناءً على معرفتك المحدودة للغاية. حاول الاندماج بخيارك!\n
• بعد أن يقول الجميع كلمة، يصوت الجميع على من يعتقدون أنه الحرباء. ويتم كشف دور الشخص الحاصل على أكبر عدد من الأصوات\n
• إذا كان لاعباً عادياً، تفوز الحرباء!
• إذا كانت الحرباء، ستحاول تخمين الكلمة السرية. إذا كان تخمينها صحيحاً تماماً، تفوز أيضاً؛ وإلا يفوز اللاعبون!"
# introduction when there is a new player, prepended to the rules
rules_prepend: "أهلاً، لدينا لاعبون جدد. ستدأ اللعبة خلال 30 ثانية، دعني أعرض القواعد سريعاً للجدد:\n\n"
# used in the strings below
here: "هنا"
# the deck command reply
# {0} and {1} will be links, instead of the url will the translation of here be used. Tell the group if that's a problem
deck: "الرزم هي مجموعة من \"البطاقات\". يمكنك إنشاء رزم جديدة أو تغيير الرزم الحالية. وهي ملفات json بسيطة. في حال قمت بإنشاء رزمة جديدة، ضع في اعتبارك أنك بحاجة لتمرير مفتاحين: اللغة والاسم. اللغة هي لغة الرزمة، والاسم هو اسم رزمتك. اجعل كليكما بحرف كبير. داخل ملف json، حدد المفاتيح التي تمثل موضوع الكلمات، ثم أنشئ قائمة بالكلمات المناسبة. يُسمح فقط بالنصوص في القائمة. يُنصح بـ 16 كلمة لكل موضوع، ولكنها ليس شرطاً. يمكنك الاطلاع على التطبيقات الفعلية {0} وانضم إلينا عبر {1} في حال كانت لديك أسئلة أو أردت إرسال ملف."
# the translation command reply
# {0} - {2} will be links, instead of the url will the translation of here be used. Tell the group if that's a problem
translation: "يمكنك ترجمة البوت بأكمله :O الملفات هي ملفات .yaml، يجب أن تكون قابلة للتعديل في أي برنامج نصوص أساسي، ولكنني أنصح بـ Notepad ++ :) إذا قبلت هذا التحدي حقاً، يمكنك العثور على الترجمات الحالية {0}. بمجرد تحميل الملف الأساسي (يُنصح بـ en لأنه الملف الأكثر تحديثاً دائماً)، قم بإعادة تسميته باستخدام كود ISO 639-1 للغتك. يُنصح برمز الحرفين ولكن ليس إلزامياً. ترجم الأجزاء الموجودة بين علامات التنصيص. في حال كنت تريد استخدام علامات التنصيص داخل نصوصك، قم بتجنبها هكذا: <code>\\\"</code> . اترك الأقواس المعقوفة كما هي ولا تغير عددها. تنسيق التليجرام مدعوم بوسوم html، وهي تعمل كما هو موضح {1}. بعد الانتهاء، انضم إلينا {2} لإرسال هذا الملف أو لطرح المزيد من الأسئلة."
# if the group id is not known. Can happen if someone obfuscates the start command or the groups id changed while the bot is offline
group_not_found: "أهلاً، أنا آسف، لكني لا أستطيع العثور على مجموعتك في قاعدة بياناتي. إما أنك تقوم بحيل هنا، أو أنه خطأ من جهتي لأنني كنت غير متصل. في هذه الحالة، قم بتشغيل /settings من دردشة المجموعة مرة أخرى :)"
# start message in private
greeting_private: "أهلاً بك، أنا بوت الحرباء :) يمكنك لعب لعبة الحرباء معي، فقط أضفني إلى مجموعتك. إذا كنت تريد تغيير اللغة التي أحدثك بها في الخاص، اضغط /language. ولا تنس أن تبتسم. على الأقل من حين لآخر."
# help message in group.
help_group: "أهلاً، تريد بعض المساعدة، عظيم. ليس لدي سوى ثلاثة أوامر رئيسية في المجموعات قد تحتاجها:\n/start - بدء لعبة\n/settings - [للمشرفين فقط في المجموعات الكبيرة] تغيير إعداداتي في المجموعة\n/nextgame - يضيفك (أو يزيلك) من قائمة اللعبة القادمة لهذه المجموعة. إذا كنت فيها، سأقوم بإعلامك عندما تبدأ لعبة\n\nبغض النظر عن ذلك، أستجيب أيضاً لهذه الأوامر:\n/abort_game - [للمشرفين فقط في المجموعات الكبيرة] إيقاف اللعبة إن وجدت لعبة جارية الآن\n/admins_reload - نظراً لأنه يتم تخزين المشرفين مؤقتاً لمدة ساعة، قد ترغب في تشغيل هذا إذا لم يتعرف عليك البوت كَمشرف، أو لم يعد من المفترض أن يفعل ذلك :O\n/id - إظهار معرف المجموعة\n\nفي حال كنت بحاجة إلى مساعدة بشرية في شيء ما، انضم إلينا عبر @TheChameleonSupport. سنكون سعداء بمساعدتك."
# help message in private.
help_private: "أهلاً، تريد بعض المساعدة، عظيم. أستجيب للأوامر التالية في الخاص:\n/language - تغيير اللغة التي أحدثك بها في الدردشة الخاصة\n/settings_help - يساهم في فهم إعدادات المجموعة\n/translation - يعرض لك رسالة مساعدة حول كيفية إجراء الترجمات\n/deck - يعرض لك كيفية إضافة رزمتك الخاصة\n\nفي حال احتجت لمساعدة بشرية في شيء ما، انضم إلينا عبر @TheChameleonSupport. سنكون سعداء بمساعدتك."
# message which gets send to people in private when a new game is started and they are on the nextgame list
# {0} group name
nextgame: "أهلاً بك. بدأت لعبة جديدة للتو في {0} وأراهن أنهم يتمنون مشاركتك في المرح."
# message which gets send to people in private which used the /nextgame command and weren't in the list before
# {0} group name
nextgame_added: "أهلاً. لقد تم إضافتك إلى قائمة اللعبة القادمة للمجموعة {0}, سأقوم بإعلامك فور بدء لعبة جديدة. بمجرد مشاركتك في لعبة ناجحة، سأقوم بإزالتك من تلك القائمة (حتى لا أزعجك بلا داعٍ :). إذا كنت تريد إزالتف بنفسك، أرسل أمر /nextgame مرة أخرى في المجموعة، وسأقوم بإزالتك حينها"
# message which gets send to people in private which used the /nextgame command and were in the list before
# {0} group name
nextgame_removed: "لقد تمت إزالتك من قائمة اللعبة القادمة للدردشة {0}"
# message which gets send to people in the group when they used /nextgame and haven't pmed the bot yet
nextgame_pm: "أهلاً. لاستخدام هذا الأمر، تحتاج إلى بدء محادثة خاصة معي. فقط اضغط على الزر أدناه."
# message which gets send to people in the group when they used /nextgame and blocked the bot (wtf)
nextgame_block: "يا هذا. إذا كنت تريد مني مراسلتك على الخاص، ما كان يجب أن تحظرني. قم بإلغاء الحظر وحاول مرة أخرى..."
# message which gets send if someone uses the /settings_help command
settings_help: "أهلاً، نظراً لوجود عدد غير قليلة من الإعدادات للمجموعة، فقد تم تقسيمها. فقط استخدم الأزرار أدناه للتنقل."
# the following strings are explanations for the settings, triggered by the command above
language_help: "<b>اللغة</b>: تغيير لغتي في مجموعتك. إذا كنت تريد معرفة المزيد حول كيفية إضافة لغتك الخاصة، اضغط /translation"
deck_help: "<b>الرزمة</b>: رزمة البطاقات التي أستخدمها في مجموعتك. تتضمن البطاقات عادة 16 كلمة مختلفة تنتمي إلى موضوع واحد. أختار عشوائياً موضوعاً ومنه الكلمة السرية للجولة. يمكنك إضافة رزمتك الخاصة، اضغط /deck لتتعلم كيف."
fewer_help: "<b>الحد الأدنى</b>: إذا كان هناك ثلاثة لاعبين فقط يلعبون (وتم تفعيل هذا)، فإن الحرباء، إذا تم القبض عليها، تحصل على تخمينين."
more_help: "<b>أكثر</b>: إذا كان هناك 7 أو 8 لاعبين يلعبون (وتم تفعيل هذا)، تختفي الكلمات بمجرد أن يقول الجميع كلمتهم، مما يجعل من الصعب على الحرباء تخمين الكلمة الصحيحة."
tournament_help: "<b>البطولة</b>: إذا تم تفعيل هذا الوضع، يتم إدخال نظام النقاط. إذا هربت الحرباء دون أن يتم كشفها، تحصل على نقطتين. إذا تم القبض عليها ووجدت الكلمة الصحيحة، تحصل على نقطة واحدة. وإذا لم تفعل، يحصل كل لاعب على نقطتين. أول لاعب يصل إلى 5 نقاط يفوز."
pin_help: "<b>التثبيت</b>: بمجرد التفعيل، سأقوم بتثبيت قائمة الكلمات بصمت لكي يتمكن اللاعبون من العثور عليها بسهولة بمجرد بدء اللعبة. سأقوم بتثبيت الرسالة المثبتة القديمة (إن وجدت) بصمت مرة أخرى عند انتهاء اللعبة. لتفعيل هذا الإعداد، تحتاج إلى جعلي مشرفاً بصلاحيات التثبيت."
restrict_help: "<b>التقييد</b>: بمجرد التفعيل، سأقوم بتقييد الجميع من الكتابة عدا الشخص الذي دور دوره خلال مرحلة قول الكلمة. يمكن للجميع الكتابة مرة أخرى بعد انتهاء هذه المرحلة. لكي يعمل هذا، سأقوم بترقية هؤلاء المستخدمين إلى مشرفين بصلاحيات إضافة أعضاء، نظراً لأن المشرفين غير مقيدين. يتم استعادة صلاحيات الدردشة الأصلية بعد المرحلة. لتفعيل هذا الإعداد، تحتاج إلى جعلي مشرفاً بصلاحيات إضافة مشرفين جدد، تقييد الأعضاء، وإضافة أعضاء. يمكنك القراءة هنا إذا كنت تريد معرفة السبب: https://t.me/TheChameleonSupport/8\n<i>انتباه:</i> تحتسب كل رسالة كمشاركة كلمة في مرحلة قول الكلمة. يتم تجاهل إعداد علامة التعجب تماماً."
exclamation_help: "<b>علامة التعجب</b>: علامة التعجب جزء أساسي من الطريقة التي تلعب بها مجموعتك هذه اللعبة. في الإعداد القياسي، يكون هذا معطلاً، مما يعني أن الرسائل التي لا تحتوي على علامة تعجب في البداية يتم احتسابها، بينما الرسائل التي تبدأ بها يتم تجاهلها. على الرغم من أن ذلك يبدو طبيعياً أكثر، إلا أن هذا السلوك قد يؤدي إلى إدخالات خاطئة عندما يتابع الأشخاص محادثة يجرونها. يمكنك تغيير هذا إلى مفعل، مما يقلب هذا السلوك. فقط الرسائل التي تبدأ بعلامة تعجب يتم احتسابها. يبدو هذا غريباً بعض الشيء، ولكنه يلغي تماماً إمكانية الإدخالات الخاطئة.\n<i>انتباه:</i> يتم تجاهل هذا الإعداد عندما تكون اللعبة في وضع التقييد، حيث لا يمكن إجراء محادثة أثناء مرحلة الإدخال."
