# and this to the /stats command
private_old_stats_command: "\n\n\nلقد لعبت هذه اللعبة لفترة طويلة الآن. في الواقع، قبل الرابع من فبراير 2020 على الأقل. هذا يعني أن إحصائياتك الفعلية أعلى قليلاً مما تم عرضه للتو. حدث هذا لأن فوز الحرباء تم إدخاله في هذا التاريخ، ولإبقاء بقية الإحصائيات مع هذا الحقل الجديد، تم إجراء قطع مباشر لأرقامك. لكن القديمة منها محفوظة ويمكن عرضها الآن:\nقبل الرابع، أنت:\n\nلعبت {0} لعبة (أي إجمالاً {1} لعبة)\nفزت بـ {2} لعبة (أي {3}% قبل الرابع، وبشكل عام {4} - {5}%)\nخسرت {6} لعبة ({7} لعبة إجمالاً)\nكنت اللاعب الأول {8} مرة ({9}% قبل الرابع، {10} مرة إجمالاً - {11}%)\nوكنت الحرباء {12} مرة ({13}% قبل، {14} مرة إجمالاً - {15}%)\n\nكما ترى، البطولات لم تتأثر (فهي محسوبة بشكل منفصل، لذا ترى الرقم كاملاً)، وكذلك الألعاب التي بدأت."
